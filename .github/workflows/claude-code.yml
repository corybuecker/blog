name: claude-code

permissions:
  contents: read
  id-token: write

on:
  issue_comment:
    types: [created]

jobs:
  claude:
    if: github.event.issue.pull_request && github.event.comment.author_association == 'OWNER' && contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@4036a180cf690f49529f5d8c79c998855287f590 # 1.0.222
        with:
          anthropic_federation_rule_id: ${{ secrets.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ secrets.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ secrets.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          claude_args: |
            --model claude-sonnet-5
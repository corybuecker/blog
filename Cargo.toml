[package]
name = "blog"
version = "2.1.0"
edition = "2024"

[dependencies]
anyhow = { version = "1.0" }
askama = { version = "0.16", default-features = false, features = ["derive", "std"] }
axum = { version = "0.8" }
jiff = { version = "0.2" }
comrak = { version = "1.0", default-features = false }
tokio = { version = "1.52", default-features = false, features = [
    "macros",
    "rt-multi-thread",
    "signal",
    "fs",
    "process",
] }
tower-http = { version = "0.7", features = ["trace", "fs"] }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
xml-builder = { version = "0.6" }

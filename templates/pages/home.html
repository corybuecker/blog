{% extends "layout.html" %}

{% block main %}
<article>
    <h1>{{ title }}</h1>
    <time datetime="{{ published_at }}">{{ published_at }}</time>
    {% if let Some(revised_at) = revised_at %}
        (revised on
        <time datetime="{{ revised_at }}">{{ revised_at }}</time>)
    {% endif %}
    {{- content|safe -}}
</article>
<h2 class="text-2xl">Older posts</h2>
<ul>
    {% for page in pages %}
        <li>
            <a
                class="underline hover:no-underline"
                href="/post/{{ page.slug }}"
            >{{ page.title }}</a>
        </li>
    {% endfor %}
</ul>
{% endblock %}
